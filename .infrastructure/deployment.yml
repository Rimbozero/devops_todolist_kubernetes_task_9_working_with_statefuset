apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: todoapp
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
      - name: todoapp
        image: todoapp:local
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - python manage.py migrate && exec python manage.py runserver 0.0.0.0:8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: SECRET_KEY
        - name: NAME
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: NAME
        - name: USER
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: USER
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: PASSWORD
        - name: HOST
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: HOST
        ports:
        - containerPort: 8080
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5